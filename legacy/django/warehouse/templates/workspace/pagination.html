<div class="pagination"><span>{{ page.paginator.count }} записів · сторінка {{ page.number }} з {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button compact" href="?{{ querystring }}&page={{ page.previous_page_number }}">← Назад</a>{% endif %}{% if page.has_next %}<a class="button compact" href="?{{ querystring }}&page={{ page.next_page_number }}">Далі →</a>{% endif %}</div></div>
